<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — REPEAT</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; line-height: 1.6; display: flex; min-height: 100vh; }
    nav.stable-side-menu { width: 220px; flex-shrink: 0; background: #161b22; border-right: 1px solid #30363d; padding: 2rem 1rem; }
    nav.stable-side-menu a { display: block; color: #58a6ff; text-decoration: none; padding: 0.4rem 0.5rem; border-radius: 4px; font-size: 0.9rem; margin-bottom: 0.25rem; }
    nav.stable-side-menu a:hover { background: #21262d; }
    nav.stable-side-menu .logo { font-weight: 700; font-size: 1.1rem; color: #e6edf3; margin-bottom: 1.5rem; display: block; }
    main { flex: 1; padding: 2.5rem; max-width: 900px; }
    nav.breadcrumb { font-size: 0.85rem; color: #8b949e; margin-bottom: 1.5rem; }
    nav.breadcrumb a { color: #58a6ff; text-decoration: none; }
    nav.breadcrumb a:hover { text-decoration: underline; }
    nav.breadcrumb span { margin: 0 0.4rem; }
    h1, h2, h3, h4 { color: #e6edf3; margin-top: 1.5rem; margin-bottom: 0.5rem; }
    h1 { font-size: 2rem; margin-top: 0; }
    h2 { font-size: 1.4rem; border-bottom: 1px solid #21262d; padding-bottom: 0.3rem; }
    p { margin-bottom: 1rem; }
    ul, ol { margin-bottom: 1rem; padding-left: 1.5rem; }
    li { margin-bottom: 0.25rem; }
    code { background: #161b22; border: 1px solid #30363d; border-radius: 3px; padding: 0.1em 0.4em; font-size: 0.9em; font-family: monospace; }
    pre { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 1rem; overflow-x: auto; margin-bottom: 1rem; }
    pre code { background: none; border: none; padding: 0; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; font-size: 0.9rem; }
    th, td { border: 1px solid #30363d; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #161b22; color: #e6edf3; }
    blockquote { border-left: 3px solid #30363d; padding-left: 1rem; color: #8b949e; margin-bottom: 1rem; }
    a { color: #58a6ff; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #21262d; font-size: 0.8rem; color: #8b949e; }
  </style>
</head>
<body>
  <nav class="stable-side-menu">
    <span class="logo">REPEAT</span>
    <a href="{{base_path}}/index.html">Home</a>
    <a href="{{base_path}}/docs/scientific-overview.html">Scientific Overview</a>
    <a href="{{base_path}}/docs/compliance-matrix.html">Compliance Matrix</a>
    <a href="{{base_path}}/docs/schema-governance.html">Schema Governance</a>
    <a href="{{base_path}}/docs/ida-control-loop.html">IDA Control Loop</a>
  </nav>
  <main>
    <nav class="breadcrumb">{{breadcrumb}}</nav>
    <article>
      {{content}}
    </article>
    <footer>
      Generated by REPEAT site projection pipeline &mdash; contract: site-projection-v2
    </footer>
  </main>
</body>
</html>
