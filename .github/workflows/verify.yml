name: delta_repeat_proof_v1 verify

on:
  push:
    branches: [ main ]
    paths:
      - 'delta_repeat_proof_v1/**'
      - '.github/workflows/verify.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'delta_repeat_proof_v1/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify delta_repeat_proof_v1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest

      - name: Run verifier
        run: python -m delta_repeat_proof_v1.verifier.verify

      - name: Run tests
        run: pytest delta_repeat_proof_v1/tests/ -v --tb=short
