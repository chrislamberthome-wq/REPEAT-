name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: B4IU locked counter
      run: make ci-count-b4iu

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'requirements-dev.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests
      run: make test

  verify-site:
    name: Verify site projection (SITE-INV-01)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install projection verifier deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema markdown

      - name: Build site HTML
        run: python site/build_site.py

      - name: Verify projection
        run: python site/verify_projection.py verify

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: site-receipt
          path: |
            site/receipt.json
            site/input.manifest.json
            site/output.manifest.json

  verify-policy:
    name: Evaluate release policy (SITE-POL)
    runs-on: ubuntu-latest
    needs: verify-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python policy deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema markdown

      - name: Rebuild certification artifacts
        run: |
          python site/build_site.py
          python site/verify_projection.py verify

      - name: Evaluate release policy
        run: python site/policy_verify.py
        continue-on-error: true

      - name: Upload policy report
        uses: actions/upload-artifact@v4
        with:
          name: site-policy-report
          path: site/policy.report.json
          if-no-files-found: ignore